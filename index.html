<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tampere Socio-Economical Index</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- H3 Core Library for Spatial Indexing -->
    <script src="https://unpkg.com/h3-js@4.1.0/dist/h3-js.umd.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh;}
        
        #map { 
            flex-grow: 1; 
            width: 100%; 
            z-index: 10;
            background-color: #0f172a;
        }
        
        /* Apply Dark Mode Hack ONLY to the base tile map! This protects data colors. */
        .leaflet-tile-pane {
            filter: brightness(0.8) invert(1) contrast(1.2) hue-rotate(200deg) saturate(0.3);
        }

        .custom-popup .leaflet-popup-content-wrapper {
            background-color: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 8px;
        }
        .custom-popup .leaflet-popup-tip { background-color: #1e293b; }
        
        .ai-build-popup .leaflet-popup-content-wrapper {
            background-color: #064e3b; color: #ecfdf5; border: 1px solid #059669;
        }
        .ai-build-popup .leaflet-popup-tip { background-color: #064e3b; }

        .legend {
            background: #111827; padding: 15px; border-radius: 8px; border: 1px solid #374151;
            color: #d1d5db; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5); font-size: 13px;
        }
        .legend h4 { margin: 0 0 10px 0; color: #10b981; font-weight: 700; text-transform: uppercase; font-size: 11px; letter-spacing: 0.05em;}
        .legend i { width: 18px; height: 18px; float: left; margin-right: 8px; opacity: 0.8; border-radius: 3px; border: 1px solid rgba(255,255,255,0.1);}
        .legend-row { clear: both; margin-bottom: 6px; display: flex; items-center;}
        
        /* Floating Toast for AI News */
        #ai-toast {
            position: fixed; bottom: -100px; left: 20px; z-index: 9999;
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(8px);
            border-left: 4px solid #ef4444; border-radius: 0 8px 8px 0;
            padding: 16px; width: 320px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
            transition: bottom 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #ai-toast.show { bottom: 20px; }
    </style>
</head>
<body>
    <header class="bg-slate-900 border-b border-slate-800 p-4 shadow-md flex justify-between items-center z-20">
        <div>
            <h1 class="text-xl font-bold text-white tracking-tight">Tampere Socio-Economical Index</h1>
            <p class="text-xs text-slate-400 mt-1">H3 Hexagonal Spatial Index (Res 9) • MML Baseline</p>
        </div>
        <div class="flex gap-3">
            <button id="ai-scan-btn" onclick="toggleAIVulnerabilityScan()" class="px-4 py-2 bg-purple-600/20 text-purple-400 border border-purple-500/30 hover:bg-purple-600/40 rounded-md text-sm font-semibold transition-colors flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                AI Vulnerability Scan
            </button>
            <button id="build-btn" onclick="toggleBuildTool()" class="px-4 py-2 bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700 rounded-md text-sm font-semibold transition-colors flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                <span id="build-text">Build Tool: OFF</span>
            </button>
            <button id="demolish-btn" onclick="toggleDemolishTool()" class="px-4 py-2 bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700 rounded-md text-sm font-semibold transition-colors flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                <span id="demolish-text">Demolish: OFF</span>
            </button>
        </div>
    </header>

    <div id="map"></div>
    
    <!-- Floating AI Vulnerability Report Panel -->
    <div id="ai-report-panel" class="hidden absolute top-20 left-4 z-50 w-80 bg-slate-900/95 backdrop-blur-md border border-slate-700 rounded-xl shadow-2xl p-5 text-white">
        <div class="flex items-center gap-2 mb-4 pb-3 border-b border-slate-700/50">
            <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"></path></svg>
            <h3 class="font-bold text-slate-100">AI Planner: Vulnerability Report</h3>
        </div>
        <div id="ai-report-content" class="text-sm text-slate-300 leading-relaxed">
            Scanning hexagonal spatial grid...
        </div>
    </div>

    <!-- AI News Toast -->
    <div id="ai-toast">
        <div class="flex items-center gap-2 mb-1">
            <span class="flex h-2 w-2 relative">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2 w-2 bg-red-500"></span>
            </span>
            <span class="text-xs font-bold text-red-400 uppercase tracking-wider">AI City Desk News Flash</span>
        </div>
        <p id="ai-toast-msg" class="text-sm text-slate-200 mt-2 font-medium"></p>
    </div>

    <script>
        // CORE CONFIGURATION
        const BOUNDS = { latMin: 61.480, latMax: 61.515, lngMin: 23.710, lngMax: 23.825 };
        const H3_RES = 9;
        
        let map;
        let h3Layer;
        let buildingsLayer;
        let tampereBuildingsData = null;
        
        // Tool States
        let isDemolishMode = false;
        let isBuildMode = false;
        let isAiScanActive = false;
        let dynamicImpacts = []; // Stores user modifications (Demolish/Build)

        // --- HELPER: Calculate SE Score based on Geography ---
        function generateSyntheticScore(lat, lng) {
            let baseScore = 6.5; 
            
            // 1. Pyynikki/Pispala (High Wealth, West)
            const dPyynikki = Math.sqrt(Math.pow(lat - 61.493, 2) + Math.pow(lng - 23.733, 2));
            if (dPyynikki < 0.015) baseScore += (0.015 - dPyynikki) * 200; 
            
            // 2. City Center (Commercial Hub, High/Avg)
            const dCenter = Math.sqrt(Math.pow(lat - 61.498, 2) + Math.pow(lng - 23.762, 2));
            if (dCenter < 0.01) baseScore += (0.01 - dCenter) * 100;
            
            // 3. Nekala (Vulnerable / Industrial, SouthEast)
            const dNekala = Math.sqrt(Math.pow(lat - 61.483, 2) + Math.pow(lng - 23.785, 2));
            if (dNekala < 0.015) baseScore -= (0.015 - dNekala) * 250; 
            
            // 4. Kauppi (Hospital/Forest, East)
            const dKauppi = Math.sqrt(Math.pow(lat - 61.505, 2) + Math.pow(lng - 23.800, 2));
            if (dKauppi < 0.01) baseScore += (0.01 - dKauppi) * 80;

            // Process dynamic user interventions (Demolish / Build)
            dynamicImpacts.forEach(mod => {
                const latDiff = lat - mod.lat;
                const lngDiff = (lng - mod.lng) * 0.48; // Adjust for longitude narrowing
                const d = Math.sqrt(latDiff * latDiff + lngDiff * lngDiff);
                const influence = Math.exp(-(d * d) / (mod.radius * mod.radius));
                baseScore += mod.impact * influence;
            });

            // Add slight organic block-by-block variance
            const noise = (Math.sin(lat * 1000) * Math.cos(lng * 1000)) * 0.5;
            baseScore += noise;

            return Math.max(0, Math.min(10, baseScore));
        }

        // --- HELPER: Translate Score to Color ---
        function getColor(val) {
            return val > 8 ? '#1e3a8a' : // Deep Blue (Wealthy)
                   val > 6 ? '#3b82f6' : // Blue (Above Average)
                   val > 5 ? '#64748b' : // Slate (Average)
                   val > 4 ? '#f59e0b' : // Amber (At Risk)
                             '#ef4444';  // Red (Vulnerable)
        }

        // --- HELPER: Robust Mathematical Lake Carving ---
        function isHexInWater(lat, lng) {
            // 1. Näsijärvi (North) - Roughly north of 61.505 and west of 23.775
            if ((lat > 61.505 && lng < 23.775) || lat > 61.512) return true;
            
            // 2. Pyhäjärvi (South/Southwest) - Roughly south of 61.488 and west of 23.765
            if (lat < 61.488 && lng < 23.765) return true;
            
            // 3. Idesjärvi (Southeast) - Tightly hugging the actual lake north of Nekala
            if (lat > 61.487 && lat < 61.495 && lng > 23.798 && lng < 23.830) return true;
            
            // 4. Viinikanlahti inlet
            if (lat < 61.492 && lat > 61.486 && lng < 23.765 && lng > 23.750) return true;

            return false;
        }

        // --- CORE: Initialize Map ---
        function initMap() {
            map = L.map('map', {
                zoomControl: false,
                preferCanvas: true
            }).setView([61.498, 23.762], 13); // Tampere Center

            L.control.zoom({ position: 'topright' }).addTo(map);

            // MML Background Layer (Inverted by CSS for dark mode)
            L.tileLayer('https://avoin-karttakuva.maanmittauslaitos.fi/avoin/wmts/1.0.0/taustakartta/default/WGS84_Pseudo-Mercator/{z}/{y}/{x}.png?api-key=fcd382c7-6e0c-44bc-9a54-f6406f36196e', {
                attribution: '&copy; Maanmittauslaitos',
                maxZoom: 18,
                minZoom: 12
            }).addTo(map);

            createLegend();
            fetchAllData();
        }

        // --- CORE: Generate H3 Hexagonal Grid ---
        function generateH3Data() {
            if (h3Layer) map.removeLayer(h3Layer);

            // H3 requires [lat, lng] for bounding poly
            const boundingPoly = [
                [BOUNDS.latMin, BOUNDS.lngMin],
                [BOUNDS.latMin, BOUNDS.lngMax],
                [BOUNDS.latMax, BOUNDS.lngMax],
                [BOUNDS.latMax, BOUNDS.lngMin],
                [BOUNDS.latMin, BOUNDS.lngMin] 
            ];

            const h3Cells = h3.polygonToCells([boundingPoly], H3_RES);
            const features = [];

            const occupiedHexes = new Set();
            if (tampereBuildingsData && tampereBuildingsData.features) {
                // Recursive function to quickly extract all vertices from complex Polygons/MultiPolygons
                function extractHexes(arr) {
                    if (typeof arr[0] === 'number') {
                        // GeoJSON is [lng, lat], H3 expects (lat, lng)
                        occupiedHexes.add(h3.latLngToCell(arr[1], arr[0], H3_RES));
                    } else if (Array.isArray(arr[0])) {
                        arr.forEach(extractHexes);
                    }
                }
                
                // Map every building vertex to an H3 Hexagon
                tampereBuildingsData.features.forEach(f => {
                    if (f.geometry && f.geometry.coordinates) {
                        extractHexes(f.geometry.coordinates);
                    }
                });
            }

            h3Cells.forEach(cell => {
                const center = h3.cellToLatLng(cell); // returns [lat, lng]
                
                // Carve out lakes mathematically
                if (isHexInWater(center[0], center[1])) return; 
                
                // Exclude empty nature/fields: skip hexes with no buildings
                if (tampereBuildingsData && !occupiedHexes.has(cell)) return;

                // Pass true to get GeoJSON [lng, lat] format back
                const boundary = h3.cellToBoundary(cell, true); 
                
                // Ensure polygon is closed for Leaflet/GeoJSON
                if (boundary[0][0] !== boundary[boundary.length-1][0] || boundary[0][1] !== boundary[boundary.length-1][1]) {
                    boundary.push(boundary[0]);
                }

                const score = generateSyntheticScore(center[0], center[1]);
                
                features.push({
                    type: "Feature",
                    properties: { id: cell, value: score },
                    geometry: { type: "Polygon", coordinates: [boundary] }
                });
            });

            // Render the Grid
            h3Layer = L.geoJson({ type: "FeatureCollection", features: features }, {
                style: getHexStyle,
                onEachFeature: (feature, layer) => {
                    // Hover effects based on active tool
                    layer.on('mouseover', (e) => {
                        if (isBuildMode) {
                            e.target.setStyle({ weight: 3, color: '#10b981', fillOpacity: 0.9 });
                        } else {
                            e.target.setStyle({ weight: 3, color: '#f8fafc', fillOpacity: 0.9 });
                        }
                        e.target.bringToFront();
                        if (buildingsLayer) buildingsLayer.bringToFront();
                    });
                    
                    layer.on('mouseout', (e) => {
                        if (!isDemolishMode) h3Layer.resetStyle(e.target);
                    });

                    // Build Tool Click Handler
                    layer.on('click', (e) => {
                        if (isBuildMode) {
                            L.DomEvent.stopPropagation(e);
                            initiateBuildProcess(e.latlng.lat, e.latlng.lng, feature.properties.value);
                        }
                    });
                }
            }).addTo(map);

            if (buildingsLayer) buildingsLayer.bringToFront();
        }

        function getHexStyle(feature) {
            const val = feature.properties.value;
            
            // If AI Scan is active, drastically alter the visual style
            if (isAiScanActive) {
                if (val < 4) {
                    // Highlight Vulnerable
                    return { fillColor: '#ef4444', weight: 2, opacity: 1, color: '#f87171', fillOpacity: 0.8 };
                } else {
                    // Ghost out healthy areas
                    return { fillColor: '#1e293b', weight: 1, opacity: 0.1, color: '#334155', fillOpacity: 0.1 };
                }
            }
            
            // Standard Style
            return {
                fillColor: getColor(val),
                weight: 1,
                opacity: 0.3,
                color: '#ffffff',
                fillOpacity: 0.65
            };
        }

        // --- CORE: Fetch & Render Buildings ---
        async function fetchAllData() {
            try {
                // Fetch Tampere Building Data specifically for our bounding box
                const url = `https://geodata.tampere.fi/geoserver/ows?service=WFS&version=1.0.0&request=GetFeature&typeName=julkinen:RAKENNUKSET_MAANP_ALUE_MVIEW&outputFormat=application/json&srsName=EPSG:4326&bbox=${BOUNDS.lngMin},${BOUNDS.latMin},${BOUNDS.lngMax},${BOUNDS.latMax},EPSG:4326`;
                
                const res = await fetch(url);
                if(res.ok) {
                    tampereBuildingsData = await res.json();
                }
                
                generateH3Data();
                renderBuildingsLayer();
                
            } catch (e) {
                console.error("Initialization Failed:", e);
                // Even if buildings fail, render the hex grid
                generateH3Data(); 
            }
        }

        function renderBuildingsLayer() {
            if (buildingsLayer) map.removeLayer(buildingsLayer);
            if (!tampereBuildingsData) return;

            buildingsLayer = L.geoJson(tampereBuildingsData, {
                style: (feature) => {
                    if (isAiScanActive) return { opacity: 0, fillOpacity: 0 }; // Hide buildings during AI Scan

                    const cat = getBuildingCategory(feature.properties, feature);
                    let color = '#94a3b8'; // Default Public/Other (Slate)
                    
                    if (cat.includes('AI Planned')) color = '#10b981'; // Luminous Emerald
                    else if (cat.includes('Residential')) color = '#14b8a6'; // Teal
                    else if (cat.includes('Commercial')) color = '#6366f1'; // Indigo
                    else if (cat.includes('Industrial')) color = '#d97706'; // Amber

                    return {
                        fillColor: color,
                        weight: 0.8, // Thinner border requested
                        color: '#020617', // Very dark border for contrast
                        opacity: 1,
                        fillOpacity: 0.95
                    };
                },
                onEachFeature: (feature, layer) => {
                    const cat = getBuildingCategory(feature.properties, feature);
                    const builtYear = getBuildingYear(feature.properties);
                    
                    // Center point calculation for popup logic
                    let centerLat = BOUNDS.latMin, centerLng = BOUNDS.lngMin;
                    if (feature.geometry.coordinates && feature.geometry.coordinates[0] && feature.geometry.coordinates[0][0]) {
                        centerLng = feature.geometry.coordinates[0][0][0];
                        centerLat = feature.geometry.coordinates[0][0][1];
                    }
                    
                    const seScore = generateSyntheticScore(centerLat, centerLng);
                    
                    const popupContent = `
                        <div class="p-1 min-w-[200px]">
                            <h4 class="font-bold text-sm mb-1">${cat}</h4>
                            <div class="text-xs text-slate-300 space-y-1 mb-3">
                                <div><span class="text-slate-400">Est. Year:</span> ${builtYear}</div>
                                <div><span class="text-slate-400">Local SE Index:</span> <span class="font-bold text-white">${seScore.toFixed(1)}/10</span></div>
                            </div>
                            <button onclick="generateAIReport('${cat}', ${seScore.toFixed(1)}, '${builtYear}')" class="w-full bg-slate-700 hover:bg-slate-600 text-white text-xs font-semibold py-1.5 rounded transition-colors border border-slate-600">
                                AI Neighborhood Analysis
                            </button>
                            <div id="ai-response-${cat.replace(/\s+/g,'')}-${builtYear}" class="mt-2 text-xs text-emerald-400 font-medium italic hidden"></div>
                        </div>
                    `;
                    
                    layer.bindPopup(popupContent, { className: 'custom-popup' });
                    
                    // Hover styles
                    layer.on('mouseover', (e) => {
                        if (isAiScanActive) return;
                        if (isDemolishMode) {
                            e.target.setStyle({ fillColor: '#ef4444', color: '#7f1d1d', weight: 2 });
                        } else {
                            e.target.setStyle({ weight: 2, color: '#ffffff' });
                        }
                    });
                    
                    layer.on('mouseout', (e) => {
                        if (isAiScanActive) return;
                        buildingsLayer.resetStyle(e.target);
                    });

                    // Click handler for Demolition
                    layer.on('click', (e) => {
                        if (isDemolishMode) {
                            L.DomEvent.stopPropagation(e);
                            map.closePopup();
                            
                            // Visual Removal
                            map.removeLayer(layer);
                            
                            // Calculate Impact (-1.5 SE drop for losing structure)
                            const impactScore = -1.5; 
                            dynamicImpacts.push({
                                lat: centerLat, lng: centerLng,
                                impact: impactScore, radius: 0.005 
                            });
                            
                            triggerAIDemolitionReport(cat, impactScore);
                            generateH3Data(); // Recalculate grid
                        }
                    });
                }
            }).addTo(map);
        }

        // --- HELPER: Deep Building Scanner ---
        function getBuildingCategory(props, feature) {
            if (props.isAIPlanned) return 'AI Planned Residential';
            
            const pStr = JSON.stringify(props).toLowerCase();
            
            // Expanded regex to catch all Tilastokeskus building codes and Finnish text variations
            if (pStr.match(/(asuin|erillis|pientalo|rivitalo|kerrostalo|vapaa-ajan|mökki|011|012|013|021|022|031|032|041)/)) return 'Residential Block';
            if (pStr.match(/(liike|toimisto|kauppa|myymälä|hotelli|ravintola|majoitus|111|112|121|151|161)/)) return 'Commercial Facility';
            if (pStr.match(/(teolli|varasto|tuotanto|halli|611|612|613|691|692)/)) return 'Industrial Warehouse';
            if (pStr.match(/(opetus|koulu|tervey|sairaal|kokoontumis|urheilu|kirkko|julk|311|312|322|323|711|712|721|722)/)) return 'Public / Other';
            
            // Failsafe: If the city API dataset lacks building usage tags, use a deterministic coordinate hash to simulate realistic zoning
            if (feature && feature.geometry && feature.geometry.coordinates) {
                try {
                    let coords = feature.geometry.coordinates[0];
                    if (Array.isArray(coords[0])) coords = coords[0]; 
                    const hash = Math.abs(Math.sin(coords[0] * coords[1] * 10000));
                    if (hash > 0.85) return 'Commercial Facility';
                    if (hash > 0.70) return 'Industrial Warehouse';
                    if (hash > 0.15) return 'Residential Block';
                } catch(e) {}
            }
            
            return 'Public / Other';
        }

        function getBuildingYear(props) {
            if (props.isAIPlanned) return '2027 (Proposed)';
            
            // Scan for year or date properties
            for (let key in props) {
                const k = key.toLowerCase();
                if (k.includes('vuosi') || k.includes('year') || k.includes('valmist') || k.includes('kayttoon') || k.includes('pvm') || k.includes('date')) {
                    const val = String(props[key]);
                    // Extract a valid 4-digit year (e.g., from "2015-08-21Z" or "2015")
                    const match = val.match(/(17|18|19|20)\d{2}/);
                    if (match) return match[0];
                }
            }
            return 'Unknown';
        }

        // --- INTERACTIVE TOOLS ---
        function toggleDemolishTool() {
            isDemolishMode = !isDemolishMode;
            if (isDemolishMode && isBuildMode) toggleBuildTool(); // Mutual Exclusivity
            
            const btn = document.getElementById('demolish-btn');
            const txt = document.getElementById('demolish-text');
            
            if (isDemolishMode) {
                btn.classList.add('bg-red-900', 'text-white', 'border-red-700');
                btn.classList.remove('bg-slate-800', 'text-slate-300', 'border-slate-700');
                txt.innerText = "Demolish: ON";
                document.getElementById('map').style.cursor = 'crosshair';
            } else {
                btn.classList.remove('bg-red-900', 'text-white', 'border-red-700');
                btn.classList.add('bg-slate-800', 'text-slate-300', 'border-slate-700');
                txt.innerText = "Demolish: OFF";
                document.getElementById('map').style.cursor = '';
            }
        }

        function toggleBuildTool() {
            isBuildMode = !isBuildMode;
            if (isBuildMode && isDemolishMode) toggleDemolishTool();
            
            const btn = document.getElementById('build-btn');
            const txt = document.getElementById('build-text');
            
            if (isBuildMode) {
                btn.classList.add('bg-emerald-900', 'text-white', 'border-emerald-700');
                btn.classList.remove('bg-slate-800', 'text-slate-300', 'border-slate-700');
                txt.innerText = "Build Tool: ON";
                document.getElementById('map').style.cursor = 'crosshair';
            } else {
                btn.classList.remove('bg-emerald-900', 'text-white', 'border-emerald-700');
                btn.classList.add('bg-slate-800', 'text-slate-300', 'border-slate-700');
                txt.innerText = "Build Tool: OFF";
                document.getElementById('map').style.cursor = '';
            }
        }

        function toggleAIVulnerabilityScan() {
            isAiScanActive = !isAiScanActive;
            const btn = document.getElementById('ai-scan-btn');
            const panel = document.getElementById('ai-report-panel');
            
            if (isAiScanActive) {
                btn.classList.add('bg-purple-600', 'text-white');
                btn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg> Close Assessment`;
                panel.classList.remove('hidden');
                
                // Calculate Stats
                let vulnHexes = 0;
                let totalScore = 0;
                h3Layer.eachLayer(layer => {
                    const val = layer.feature.properties.value;
                    if (val < 4) {
                        vulnHexes++;
                        totalScore += val;
                    }
                });
                
                const avg = vulnHexes > 0 ? (totalScore / vulnHexes).toFixed(1) : "N/A";
                
                document.getElementById('ai-report-content').innerHTML = `
                    <div class="flex justify-between items-center mb-3 p-2 bg-slate-800 rounded">
                        <span class="text-slate-400">Vulnerable Hectares:</span>
                        <span class="text-red-400 font-bold text-lg">${vulnHexes}</span>
                    </div>
                    <div class="flex justify-between items-center mb-4 p-2 bg-slate-800 rounded">
                        <span class="text-slate-400">Avg SE Index:</span>
                        <span class="text-red-400 font-bold text-lg">${avg}/10</span>
                    </div>
                    <div class="border-t border-slate-700 pt-3">
                        <span class="text-xs uppercase text-purple-400 font-bold tracking-wider mb-2 block">AI Strategy Generator</span>
                        <p class="italic text-emerald-300">"Prioritize infill development of mixed-income housing in the southern industrial corridor. Upgrade local transit nodes to connect these isolated zones to the commercial center, stimulating organic economic growth without triggering rapid gentrification."</p>
                    </div>
                `;
            } else {
                btn.classList.remove('bg-purple-600', 'text-white');
                btn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg> AI Vulnerability Scan`;
                panel.classList.add('hidden');
            }
            
            // Re-render map to apply visual styles
            if (h3Layer) h3Layer.setStyle(getHexStyle);
            if (buildingsLayer) buildingsLayer.setStyle(buildingsLayer.options.style);
        }

        // --- AI ACTION TRIGGERS ---
        async function generateAIReport(cat, seScore, year) {
            const elId = `ai-response-${cat.replace(/\s+/g,'')}-${year}`;
            const el = document.getElementById(elId);
            el.innerHTML = "Thinking...";
            el.classList.remove('hidden');
            
            setTimeout(() => {
                let response = "";
                if (seScore < 5) response = "Vulnerable block. Infrastructure upgrades and affordable commercial spaces are recommended to boost local economy without displacement.";
                else if (seScore > 7) response = "Stable, high-wealth block. Ideal location for introducing integrated supported-housing to maintain demographic diversity.";
                else response = "Transitional block. Maintaining the current balance of residential and commercial zoning is recommended to prevent stagnation.";
                
                el.innerHTML = response;
            }, 800);
        }

        function triggerAIDemolitionReport(cat, impactScore) {
            const toast = document.getElementById('ai-toast');
            const msgEl = document.getElementById('ai-toast-msg');
            
            let news = "";
            if (cat.includes('Industrial')) news = "Industrial site cleared. Speculators eye the lot for trendy loft conversions, shifting local demographics.";
            else if (cat.includes('Residential')) news = "Housing stock reduced. Displacement concerns rise among locals as the neighborhood loses density.";
            else news = "Commercial hub destroyed. Local economy takes a minor hit as jobs temporarily leave the immediate block.";
            
            msgEl.innerText = news;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 5000);
        }

        async function initiateBuildProcess(lat, lng, seScore) {
            const popup = L.popup({ closeOnClick: false, className: 'ai-build-popup' })
                .setLatLng([lat, lng])
                .setContent(`
                    <div class="p-2 w-56">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="animate-pulse h-2 w-2 bg-emerald-400 rounded-full"></span>
                            <span class="text-xs font-bold uppercase tracking-wider text-emerald-400">AI Architect</span>
                        </div>
                        <p class="text-xs mb-3">Analyzing SE Index (${seScore.toFixed(1)})...</p>
                        <div id="ai-build-pitch" class="hidden">
                            <p class="text-xs italic mb-4" id="ai-pitch-text"></p>
                            <div class="flex gap-2">
                                <button onclick="confirmBuild(${lat}, ${lng})" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-1.5 rounded transition">Approve</button>
                                <button onclick="map.closePopup()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-600 text-xs font-bold py-1.5 rounded transition">Cancel</button>
                            </div>
                        </div>
                    </div>
                `).openOn(map);

            setTimeout(() => {
                const pitchEl = document.getElementById('ai-build-pitch');
                const textEl = document.getElementById('ai-pitch-text');
                if (pitchEl && textEl) {
                    if (seScore < 5) textEl.innerText = "Pitch: High-quality modern flats recommended here to anchor the block and attract new economic investment to this vulnerable zone.";
                    else if (seScore > 7) textEl.innerText = "Pitch: City strategy recommends 'Supported Housing' unit here to ensure demographic mixing in this high-wealth area.";
                    else textEl.innerText = "Pitch: Standard mixed-use residential block recommended to maintain the healthy average index of this neighborhood.";
                    pitchEl.classList.remove('hidden');
                }
            }, 1000);
        }
        
        window.confirmBuild = function(lat, lng) {
            map.closePopup();
            
            // Create a small footprint for the new building
            const size = 0.0003; 
            const newBldg = {
                type: "Feature",
                properties: { isAIPlanned: true },
                geometry: {
                    type: "Polygon",
                    coordinates: [[
                        [lng - size, lat - size],
                        [lng + size, lat - size],
                        [lng + size, lat + size],
                        [lng - size, lat + size],
                        [lng - size, lat - size]
                    ]]
                }
            };
            
            tampereBuildingsData.features.push(newBldg);
            
            // Building positive development raises SE Score
            dynamicImpacts.push({
                lat: lat, lng: lng,
                impact: +1.2, radius: 0.006 
            });
            
            // Re-render everything
            generateH3Data();
            renderBuildingsLayer();
            
            // Turn off build tool
            toggleBuildTool();
        };

        function createLegend() {
            const legend = L.control({position: 'bottomright'});
            legend.onAdd = function (map) {
                const div = L.DomUtil.create('div', 'legend');
                
                // SE Index Legend
                div.innerHTML += '<h4>SE Index</h4>';
                const seColors = ['#ef4444', '#f59e0b', '#64748b', '#3b82f6', '#1e3a8a'];
                const seLabels = ['Vulnerable (<4)', 'At Risk (4-5)', 'Average (5-6)', 'Above Avg (6-8)', 'Wealthy (>8)'];
                for (let i = 0; i < seColors.length; i++) {
                    div.innerHTML += `<div class="legend-row"><i style="background:${seColors[i]}"></i> ${seLabels[i]}</div>`;
                }
                
                // Buildings Legend
                div.innerHTML += '<h4 style="margin-top:15px; color:#6366f1;">Buildings</h4>';
                const bldgColors = ['#14b8a6', '#6366f1', '#d97706', '#94a3b8', '#10b981'];
                const bldgLabels = ['Residential', 'Commercial', 'Industrial', 'Public / Other', 'AI Planned'];
                for (let i = 0; i < bldgColors.length; i++) {
                    div.innerHTML += `<div class="legend-row"><i style="background:${bldgColors[i]}"></i> ${bldgLabels[i]}</div>`;
                }
                
                return div;
            };
            legend.addTo(map);
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', initMap);

    </script>
</body>
</html>
